name: With Actions 
on: 
  workflow_dispatch
jobs:
   with-Actions:
      runs-on: ubuntu-latest  
      steps:
      - name: Check out repo
        uses: actions/checkout@v3
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
         