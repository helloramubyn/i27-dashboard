name: Academy DevOps Dashboard - CI
on: 
  push:
    branches:
    - main
    paths:
    - 'src/**'
    - 'pom.xml'
    - 'Dockerfile'
  pull_request:
    branches:
    - main:
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch:
jobs:
 #---------- Job1 : Test-------#
  test: #---job id---, this can be later uses, if I want to refer this jon ---#
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v3
    - name: set up Java 21
      uses: actions/setup-java@v4
      with:
         java-version: '21'
         distribution: temurin
         cache: maven
    - name: Run tests of maven
      run: mvn test
    - name: Upload test results, reports
      uses: actions/upload-artifact@v4
      with: 
         name: surefire-reports
         path: target/surefire-reports/
         retention-days: 7

    

