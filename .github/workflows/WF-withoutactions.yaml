name: Without Actions 
on: 
  workflow_dispatch
jobs:
   manual-setup:
      runs-on: ubuntu-latest  
      steps:
      - name: Manually Cloning the repo
        run: |
         echo "cloning the repo"
         git clone https://github.com/${{ github.repository}}.git .
         echo "List of Files after cloning"    
         echo "=====================" 
         ls -la
         echo "====================="
         pwd
      - name: Verify Default java Package
        run: |
         echo "Validating Java version"
         java -version  
      - name: Installing manually Java 21 version
        run: |
         echo "Installing Java 21 version by downloading tar.gz file"
         wget -q https://download.java.net/java/GA/jdk17.0.2/dfd4a8d0985749f896bed50d7138ee7f/8/GPL/openjdk-17.0.2_linux-x64_bin.tar.gz
         tar -xzf openjdk-17.0.2_linux-x64_bin.tar.gz
         export JAVA_HOME=/opt/jdk-17
         export PATH=$PATH:$JAVA_HOME/bin
         export M2_HOME=/opt/apache-maven-3.8.8
         export PATH=$PATH:$M2_HOME/bin
